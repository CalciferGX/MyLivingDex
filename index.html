<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéCoach</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- App header and toolbar are rendered statically in HTML. -->
    <!-- Dynamic content is populated by script.js after loading data.csv. -->
    <div class="sticky-top">
        <h1>PokéCoach</h1>

        <div class="toolbar">
            <input id="filterInput" placeholder="Enter a filter...">
            <div id="toggleFilters" class="toggle-filters"></div>
        </div>

        <div id="activeFilters"></div>
    </div>

    <div id="pokemonList"></div>

    <script src="script.js"></script>

</body>
</html>
